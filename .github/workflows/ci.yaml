name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      # The release pipeline builds with CGO_ENABLED=0, but `go test -race`
      # below requires cgo, so the race job silently runs with cgo enabled.
      # Without this step a cgo-requiring dependency lands with CI green and
      # breaks only at tag time.
      - name: Build without cgo
        run: CGO_ENABLED=0 go build ./...
      # The disk-usage helper is a //go:build unix / !unix pair. Only a
      # non-unix target compiles the fallback, so a break there is invisible
      # to every other step.
      - name: Cross-compile
        run: |
          GOOS=windows GOARCH=amd64 go build ./...
          GOOS=darwin GOARCH=arm64 go build ./...
      - name: Test
        run: go test -race ./...
